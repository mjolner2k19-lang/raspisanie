function nowMinsk(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Minsk',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{day:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday),mins:Number(p.hour)*60+Number(p.minute),time:p.hour+':'+p.minute,iso:p.year+'-'+p.month+'-'+p.day}};

 $('grades').innerHTML=grades.map(n=>'<button type="button" class="grade-button '+(n===g?'active':'')+'" data-grade="'+n+'">'+n+'</button>').join('');
 $('grades').querySelectorAll('button').forEach(b=>b.onclick=()=>{const keys=classKeys.filter(k=>gradeOf(k)===Number(b.dataset.grade)).sort((a,b)=>a.localeCompare(b,'ru'));if(keys.length)chooseClass(keys[0])});
 $('classes').innerHTML=classKeys.filter(k=>gradeOf(k)===g).sort((a,b)=>a.localeCompare(b,'ru')).map(k=>'<button type="button" class="class-button '+(k===selectedClass?'active':'')+'" data-class="'+esc(k)+'">'+esc(k.replace(/^(\d+)/,'$1 «')+'»')+'</button>').join('');
 $('classes').querySelectorAll('button').forEach(b=>b.onclick=()=>chooseClass(b.dataset.class));
}
function render(){const t=nowMinsk();$('clock').textContent=t.time;calendar(t);renderClassPicker();
 const view=chosen===null?(t.day>4?0:t.day):chosen;
 const isVacation=HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end);
 const actual=view===t.day&&!isVacation;
 const weekend=t.day>4&&chosen===null;
 const vacation=isVacation&&chosen===null;
 const list=(ALL[selectedClass]&&ALL[selectedClass][view])||[];
 document.body.dataset.day=view;
 $('days').innerHTML=DAYNAMES.map((d,i)=>'<button type="button" class="day '+(view===i?'active':'')+'" data-i="'+i+'" aria-label="'+d+'" aria-pressed="'+(view===i)+'">'+['Пн','Вт','Ср','Чт','Пт'][i]+'</button>').join('');
 $('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.i);render()});
 $('today').onclick=()=>{chosen=null;render()};
 $('heading').textContent='Уроки '+selectedClass.replace(/^(\d+)/,'$1 «')+'» · '+DAYNAMES[view].toLowerCase();
 let active=-1,upcoming=-1;
 if(actual){for(let i=0;i<list.length;i++){if(t.mins>=toMinutes(list[i].start)&&t.mins<toMinutes(list[i].end))active=i;if(upcoming===-1&&t.mins<toMinutes(list[i].start))upcoming=i}}
 const hindex=actual?(active>=0?active:upcoming>=0?upcoming:Math.max(0,list.length-1)):0;
 const lesson=list[hindex];
 $('daylabel').textContent=active>=0?'ИДЁТ УРОК':actual&&upcoming>=0?(upcoming===0?'ДО НАЧАЛА ЗАНЯТИЙ':'ПЕРЕМЕНА'):DAYNAMES[view].toUpperCase();$('heroClass').textContent=selectedClass.replace(/^(\d+)/,'$1 «')+'»';
 $('subject').textContent=lesson?lesson.subject:'Уроков нет';
 $('start').textContent=lesson?lesson.start+'–'+lesson.end:'—';
 $('room').textContent=lesson?(lesson.room||'—'):'—';
 $('roomwrap').style.display=lesson&&lesson.room?'inline-flex':'none';
 let message='';
 if(!lesson)message='Нет занятий';
 else if(weekend)message='Первый урок в понедельник';
 else if(vacation)message='Сейчас каникулы';
 else if(!actual)message='Первый урок · '+lesson.start;
 else if(active>=0)message='До звонка: '+(toMinutes(lesson.end)-t.mins)+' мин';
 else if(upcoming>=0)message='До урока: '+(toMinutes(lesson.start)-t.mins)+' мин';
 else message='Уроки на сегодня закончились';
 $('timerlabel').textContent=active>=0?'ДО ЗВОНКА':actual&&upcoming>=0?'ДО УРОКА':!actual&&!vacation&&!weekend?'НАЧАЛО':'СТАТУС';$('timertxt').textContent=active>=0?(toMinutes(lesson.end)-t.mins)+' мин':actual&&upcoming>=0?(toMinutes(lesson.start)-t.mins)+' мин':!actual&&!vacation&&!weekend&&lesson?lesson.start:message;const progress=active>=0&&lesson?(t.mins-toMinutes(lesson.start))/(toMinutes(lesson.end)-toMinutes(lesson.start))*100:0;$('fill').style.width=Math.max(0,Math.min(100,progress))+'%';$('progress').hidden=active<0;$('progress').setAttribute('aria-valuenow',String(Math.round(progress)));
 let next=null,nextday=view;
 if(lesson){if(hindex+1<list.length)next=list[hindex+1];else {for(let n=1;n<=5;n++){const d=(view+n)%5;if(ALL[selectedClass][d]&&ALL[selectedClass][d].length){next=ALL[selectedClass][d][0];nextday=d;break}}}}
 $('nextlabel').textContent=nextday===view?'Следующий урок':'Следующий учебный день';
 $('nextname').textContent=next?next.subject:'Занятий больше нет';
 $('nextdetail').textContent=next?(nextday===view?'':DAYNAMES[nextday]+' · ')+next.start+' · '+(next.room||'Без кабинета'):'';
 $('lessons').innerHTML=list.length?list.map((x,i)=>'<article class="lesson glass '+(actual&&i===active?'active':actual&&t.mins>=toMinutes(x.end)?'past':'')+'"><span class="num">'+(x.num===0?'0':esc(x.num))+'</span><div><div class="name">'+esc(x.subject)+'</div><div class="hours">'+esc(x.start)+'–'+esc(x.end)+'</div></div><div class="room">'+esc(x.room||'—')+'</div></article>').join(''):'<div class="empty-day">На этот день занятий нет</div>';
}
render();setInterval(render,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
